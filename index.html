<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sync</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
<style>
  :root{
    --bg:#0A0A0A;
    --surface:#141414;
    --border:#2A2A2A;
    --text:#F5F0EA;
    --text-dim:#7A7A75;
    --live:#4CAF6D;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:48px 20px 80px;
  }
  header{
    width:100%;
    max-width:920px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:56px;
  }
  .logo{
    height:52px;
    width:auto;
    display:block;
  }
  #globalStatus{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
  }
  #globalStatus.paired{ color: var(--live); }

  .pairing{
    width:100%;
    max-width:920px;
    display:grid;
    grid-template-columns:1fr 88px 1fr;
    align-items:stretch;
    gap:0;
  }
  @media (max-width:720px){
    .pairing{ grid-template-columns:1fr; }
    .connector{ transform:rotate(90deg); width:100%; height:88px; }
  }

  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:2px;
    padding:24px;
    display:flex;
    flex-direction:column;
    min-height:340px;
  }
  .panel-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:4px;
  }
  .panel-title{
    font-size:17px;
    font-weight:600;
    margin-bottom:20px;
  }

  .connector{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .connector-line{
    width:100%;
    height:1px;
    background-image:linear-gradient(to right, var(--border) 50%, transparent 0%);
    background-size:8px 1px;
    background-repeat:repeat-x;
  }
  .connector.paired .connector-line{
    background-image:none;
    background-color:var(--text-dim);
  }
  .connector-dot{
    position:absolute;
    width:8px;height:8px;
    border-radius:50%;
    background:var(--border);
  }
  .connector.paired .connector-dot{
    background:var(--live);
    box-shadow:0 0 8px var(--live);
  }

  button{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:14px;
    font-weight:500;
    padding:10px 16px;
    border-radius:2px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text);
    cursor:pointer;
  }
  button:hover:not(:disabled){ border-color:var(--text-dim); }
  button:disabled{ opacity:0.35; cursor:default; }
  button.primary{
    background:var(--text);
    color:var(--bg);
    border-color:var(--text);
  }
  button.primary:hover:not(:disabled){ opacity:0.85; }

  .item-list{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:6px;
    overflow-y:auto;
    max-height:220px;
  }
  .item{
    text-align:left;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:2px;
    background:transparent;
    color:var(--text);
    font-size:13px;
    cursor:pointer;
  }
  .item:hover{ border-color:var(--text-dim); }
  .item.selected{
    border-color:var(--live);
    background:rgba(76,175,109,0.08);
  }
  .empty-hint{
    color:var(--text-dim);
    font-size:13px;
    line-height:1.6;
  }

  .pair-action{
    max-width:920px;
    width:100%;
    display:flex;
    justify-content:center;
    margin-top:32px;
  }

  .backend-row{
    max-width:920px;
    width:100%;
    margin-top:56px;
    padding-top:24px;
    border-top:1px solid var(--border);
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
    justify-content:space-between;
  }
  .backend-row .field{
    display:flex;
    flex-direction:column;
    gap:4px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
  }
  .backend-row input{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 10px;
    border-radius:2px;
    width:260px;
  }
  #statusLine{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
    margin-top:20px;
    text-align:center;
    max-width:600px;
  }
</style>
</head>

<div class="pairing">
  <div class="panel">
    <div class="panel-label">source</div>
    <div class="panel-title">Spreadsheet</div>
    <button id="signinBtn">Sign in with Microsoft</button>
    <div class="item-list" id="fileList" style="margin-top:16px;">
      <div class="empty-hint">Sign in to see your OneDrive files.</div>
    </div>
  </div>

  <div class="connector" id="connector">
    <div class="connector-line"></div>
    <div class="connector-dot" style="left:calc(50% - 24px);"></div>
    <div class="connector-dot" style="left:calc(50% + 16px);"></div>
  </div>

  <div class="panel">
    <div class="panel-label">destination</div>
    <div class="panel-title">Calendar</div>
    <div style="height:38px;"></div>
    <div class="item-list" id="calendarList">
      <div class="empty-hint">Sign in to see your calendars.</div>
    </div>
  </div>
</div>

<div class="pair-action">
  <button class="primary" id="pairBtn" disabled>Pair &amp; start syncing hourly</button>
</div>

<div id="statusLine"></div>

<div class="backend-row">
  <div class="field">
    Function App URL
    <input id="funcUrl" placeholder="https://your-app.azurewebsites.net">
  </div>
  <div class="field">
    Function Key
    <input id="funcKey" type="password" placeholder="paste key here">
  </div>
  <div style="display:flex; gap:8px;">
    <button id="authorizeBtn">Authorize backend</button>
    <button id="syncNowBtn">Sync now</button>
  </div>
</div>

<script>
const msalConfig = {
  auth: {
    clientId: "aa637561-684f-436c-8177-e6e8d65a8c31",
    authority: "https://login.microsoftonline.com/common",
    redirectUri: window.location.href
  }
};
const msalInstance = new msal.PublicClientApplication(msalConfig);
const scopes = ["Calendars.ReadWrite", "Files.ReadWrite"];

let accessToken = null;
let selectedFile = null;
let selectedCalendar = null;

const $ = id => document.getElementById(id);

function loadSettings() {
  $("funcUrl").value = localStorage.getItem("funcUrl") || "";
  $("funcKey").value = localStorage.getItem("funcKey") || "";
}
function saveSettings() {
  localStorage.setItem("funcUrl", $("funcUrl").value.trim());
  localStorage.setItem("funcKey", $("funcKey").value.trim());
}
$("funcUrl").addEventListener("change", saveSettings);
$("funcKey").addEventListener("change", saveSettings);
loadSettings();

function setStatus(msg) { $("statusLine").textContent = msg; }

async function getToken() {
  const account = msalInstance.getActiveAccount();
  const result = await msalInstance.acquireTokenSilent({ scopes, account });
  accessToken = result.accessToken;
  return accessToken;
}

async function graphFetch(path) {
  await getToken();
  const res = await fetch("https://graph.microsoft.com/v1.0" + path, {
    headers: { Authorization: "Bearer " + accessToken }
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

$("signinBtn").onclick = async () => {
  try {
    const result = await msalInstance.loginPopup({ scopes });
    msalInstance.setActiveAccount(result.account);
    $("signinBtn").textContent = "Signed in as " + result.account.username;
    $("signinBtn").disabled = true;
    await loadFiles();
    await loadCalendars();
  } catch (e) {
    setStatus("Sign-in failed: " + e.message);
  }
};

async function loadFiles() {
  const data = await graphFetch("/me/drive/root/children?$select=id,name,file");
  const list = $("fileList");
  list.innerHTML = "";
  const files = data.value.filter(f => f.file && f.name.endsWith(".xlsx"));
  if (!files.length) {
    list.innerHTML = '<div class="empty-hint">No .xlsx files found in your OneDrive root.</div>';
    return;
  }
  files.forEach(f => {
    const div = document.createElement("div");
    div.className = "item";
    div.textContent = f.name;
    div.onclick = () => {
      document.querySelectorAll("#fileList .item").forEach(i => i.classList.remove("selected"));
      div.classList.add("selected");
      selectedFile = f;
      updatePairButton();
    };
    list.appendChild(div);
  });
}

async function loadCalendars() {
  const data = await graphFetch("/me/calendars?$select=id,name");
  const list = $("calendarList");
  list.innerHTML = "";
  data.value.forEach(c => {
    const div = document.createElement("div");
    div.className = "item";
    div.textContent = c.name;
    div.onclick = () => {
      document.querySelectorAll("#calendarList .item").forEach(i => i.classList.remove("selected"));
      div.classList.add("selected");
      selectedCalendar = c;
      updatePairButton();
    };
    list.appendChild(div);
  });
}

function updatePairButton() {
  $("pairBtn").disabled = !(selectedFile && selectedCalendar);
}

$("pairBtn").onclick = async () => {
  const funcUrl = $("funcUrl").value.trim().replace(/\/$/, "");
  const funcKey = $("funcKey").value.trim();
  if (!funcUrl || !funcKey) {
    setStatus("Enter your Function App URL and key below first.");
    return;
  }
  try {
    const res = await fetch(`${funcUrl}/api/saveConfig?code=${encodeURIComponent(funcKey)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ driveItemId: selectedFile.id, calendarId: selectedCalendar.id, sheetName: "Calendar" })
    });
    if (!res.ok) throw new Error(await res.text());
    $("connector").classList.add("paired");
    $("globalStatus").textContent = "paired \u2014 syncing hourly";
    $("globalStatus").classList.add("paired");
    setStatus(`Paired "${selectedFile.name}" with "${selectedCalendar.name}". First sync runs within the hour, or use Sync now below.`);
  } catch (e) {
    setStatus("Couldn't pair: " + e.message);
  }
};

$("authorizeBtn").onclick = () => {
  const funcUrl = $("funcUrl").value.trim().replace(/\/$/, "");
  if (!funcUrl) { setStatus("Enter your Function App URL first."); return; }
  window.open(`${funcUrl}/api/authStart`, "_blank");
};

$("syncNowBtn").onclick = async () => {
  const funcUrl = $("funcUrl").value.trim().replace(/\/$/, "");
  const funcKey = $("funcKey").value.trim();
  if (!funcUrl || !funcKey) { setStatus("Enter your Function App URL and key first."); return; }
  setStatus("Syncing...");
  try {
    const res = await fetch(`${funcUrl}/api/syncNow?code=${encodeURIComponent(funcKey)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data);
    setStatus(`Synced \u2014 added ${data.added}, removed ${data.removed}.` + (data.errors?.length ? " Errors: " + data.errors.join("; ") : ""));
  } catch (e) {
    setStatus("Sync failed: " + e.message);
  }
};

// on load, check current pairing status if we already have a function URL saved
(async () => {
  const funcUrl = $("funcUrl").value.trim().replace(/\/$/, "");
  if (!funcUrl) return;
  try {
    const res = await fetch(`${funcUrl}/api/getConfig`);
    const data = await res.json();
    if (data.paired) {
      $("connector").classList.add("paired");
      $("globalStatus").textContent = "paired \u2014 syncing hourly";
      $("globalStatus").classList.add("paired");
    }
  } catch (e) { /* ignore on load */ }
})();
</script>
</body>
</html>
