<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Excel -> Calendar Sync</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2/lib/msal-browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; background:#1e1e1e; color:#eee; padding: 20px; }
  button { padding: 8px 14px; margin-right: 10px; cursor: pointer; }
  select { padding: 6px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border: 1px solid #444; padding: 6px 10px; text-align: left; font-size: 14px; }
  th { background: #2a2a2a; }
  #status { color: #aaa; margin-top: 10px; }
  .row { margin-bottom: 14px; }
  #signout { display:none; }
</style>
</head>
<body>

<h2>Excel -&gt; Calendar Sync</h2>

<div class="row">
  <button id="signin">Sign in with Microsoft</button>
  <button id="signout">Sign out</button>
</div>

<div class="row">
  <label>Excel File: </label>
  <input type="file" id="fileInput" accept=".xlsx" disabled>
</div>

<div class="row">
  <label>Calendar: </label>
  <select id="calendarSelect" disabled></select>
  <button id="refreshCalendars" disabled>Refresh List</button>
</div>

<div class="row">
  <strong>Changes that will be made:</strong>
  <table>
    <thead><tr><th>Action</th><th>Dates</th><th>Event Title</th></tr></thead>
    <tbody id="previewBody"></tbody>
  </table>
</div>

<div class="row">
  <button id="applyBtn" disabled>Apply Changes</button>
</div>

<div id="status"></div>

<script>
// ====== CONFIGURE THIS ======
const msalConfig = {
  auth: {
    clientId: "aa637561-684f-436c-8177-e6e8d65a8c31",       // <-- from Azure app registration
    authority: "https://login.microsoftonline.com/common",
    redirectUri: window.location.href
  }
};
// =============================

const msalInstance = new msal.PublicClientApplication(msalConfig);
const graphScopes = ["Calendars.ReadWrite"];

let accessToken = null;
let currentFile = null;
let workbookData = null; // {headers, rows, colIndex}
let toCreate = [];
let toDelete = []; // {id, title}

const TAG_REGEX = /\[SyncID:([a-f0-9]{8})\]/;
const REQUIRED_COLUMNS = ["Include", "Start Date", "End Date", "Event Title", "Added to Calendar"];

function setStatus(msg) { document.getElementById("status").textContent = msg; }
function uuidShort() { return crypto.randomUUID().replace(/-/g, "").slice(0, 8); }

// ---------- AUTH ----------

document.getElementById("signin").onclick = async () => {
  try {
    const result = await msalInstance.loginPopup({ scopes: graphScopes });
    msalInstance.setActiveAccount(result.account);
    await getToken();
    document.getElementById("signin").style.display = "none";
    document.getElementById("signout").style.display = "inline-block";
    document.getElementById("fileInput").disabled = false;
    document.getElementById("calendarSelect").disabled = false;
    document.getElementById("refreshCalendars").disabled = false;
    setStatus("Signed in as " + result.account.username);
    await loadCalendars();
  } catch (e) {
    setStatus("Sign-in failed: " + e.message);
  }
};

document.getElementById("signout").onclick = async () => {
  await msalInstance.logoutPopup();
  location.reload();
};

async function getToken() {
  const account = msalInstance.getActiveAccount();
  const result = await msalInstance.acquireTokenSilent({ scopes: graphScopes, account });
  accessToken = result.accessToken;
  return accessToken;
}

async function graphFetch(path, options = {}) {
  await getToken();
  const res = await fetch("https://graph.microsoft.com/v1.0" + path, {
    ...options,
    headers: {
      "Authorization": "Bearer " + accessToken,
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });
  if (!res.ok) {
    const text = await res.text();
    throw new Error(`Graph API error (${res.status}): ${text}`);
  }
  if (res.status === 204) return null;
  return res.json();
}

// ---------- CALENDARS ----------

async function loadCalendars() {
  try {
    const data = await graphFetch("/me/calendars?$select=id,name");
    const select = document.getElementById("calendarSelect");
    select.innerHTML = "";
    data.value.forEach(cal => {
      const opt = document.createElement("option");
      opt.value = cal.id;
      opt.textContent = cal.name;
      select.appendChild(opt);
    });
    setStatus(`Found ${data.value.length} calendar(s).`);
  } catch (e) {
    setStatus("Couldn't load calendars: " + e.message);
  }
}
document.getElementById("refreshCalendars").onclick = loadCalendars;
document.getElementById("calendarSelect").onchange = refreshPreview;

// ---------- EXCEL ----------

document.getElementById("fileInput").onchange = async (e) => {
  currentFile = e.target.files[0];
  if (!currentFile) return;
  const buf = await currentFile.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array", cellDates: true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });

  const headers = rows[0];
  const missing = REQUIRED_COLUMNS.filter(c => !headers.includes(c));
  if (missing.length) {
    setStatus("Missing required column(s): " + missing.join(", "));
    return;
  }

  const colIndex = {};
  headers.forEach((h, i) => colIndex[h] = i);
  const extraCols = headers.filter(h => h && !REQUIRED_COLUMNS.includes(h) && h !== "Notes");

  workbookData = { wb, ws, headers, rows, colIndex, extraCols, sheetName: wb.SheetNames[0] };
  await refreshPreview();
};

function parseSheetRows() {
  const { rows, colIndex, extraCols } = workbookData;
  const toCreateLocal = [];
  const keepIds = new Set();

  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    const include = String(row[colIndex["Include"]] || "").trim().toUpperCase();
    const title = row[colIndex["Event Title"]];
    const existingVal = String(row[colIndex["Added to Calendar"]] || "").trim();
    const existingId = /^[a-f0-9]{8}$/.test(existingVal) ? existingVal : null;

    if (include !== "Y" || !title) continue;

    const start = row[colIndex["Start Date"]];
    const end = row[colIndex["End Date"]];
    if (!(start instanceof Date) || !(end instanceof Date)) continue;

    if (existingId) {
      keepIds.add(existingId);
      continue;
    }

    const notesParts = [];
    if (colIndex["Notes"] !== undefined && row[colIndex["Notes"]]) notesParts.push(String(row[colIndex["Notes"]]));
    extraCols.forEach(col => {
      const val = row[colIndex[col]];
      if (val) notesParts.push(`${col}: ${val}`);
    });

    toCreateLocal.push({ rowIndex: r, title: String(title).trim(), start, end, notes: notesParts.join("\n") });
  }
  return { toCreateLocal, keepIds };
}

async function getTaggedEvents(calendarId) {
  let url = `/me/calendars/${calendarId}/events?$select=id,subject,body&$top=100`;
  const found = {};
  while (url) {
    const data = await graphFetch(url.startsWith("http") ? url.replace("https://graph.microsoft.com/v1.0", "") : url);
    data.value.forEach(ev => {
      const content = ev.body && ev.body.content ? ev.body.content : "";
      const match = content.match(TAG_REGEX);
      if (match) found[match[1]] = { title: ev.subject, id: ev.id };
    });
    url = data["@odata.nextLink"] || null;
  }
  return found;
}

async function refreshPreview() {
  document.getElementById("previewBody").innerHTML = "";
  const calendarId = document.getElementById("calendarSelect").value;
  if (!workbookData || !calendarId) return;

  setStatus("Checking calendar...");
  const { toCreateLocal, keepIds } = parseSheetRows();
  toCreate = toCreateLocal;

  let existingTagged = {};
  try {
    existingTagged = await getTaggedEvents(calendarId);
  } catch (e) {
    setStatus("Couldn't read calendar: " + e.message);
    return;
  }

  toDelete = Object.entries(existingTagged)
    .filter(([sid]) => !keepIds.has(sid))
    .map(([sid, info]) => ({ sid, id: info.id, title: info.title }));

  const tbody = document.getElementById("previewBody");
  toCreate.forEach(e => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>ADD</td><td>${e.start.toDateString()} to ${e.end.toDateString()}</td><td>${e.title}</td>`;
    tbody.appendChild(tr);
  });
  toDelete.forEach(e => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>REMOVE</td><td></td><td>${e.title}</td>`;
    tbody.appendChild(tr);
  });

  const total = toCreate.length + toDelete.length;
  document.getElementById("applyBtn").disabled = total === 0;
  setStatus(total ? `${toCreate.length} to add, ${toDelete.length} to remove.` : "Calendar already matches this spreadsheet.");
}

// ---------- APPLY ----------

document.getElementById("applyBtn").onclick = async () => {
  const calendarId = document.getElementById("calendarSelect").value;
  const confirmMsg = `Add ${toCreate.length} event(s) and remove ${toDelete.length} event(s)?`;
  if (!confirm(confirmMsg)) return;

  let added = 0, removed = 0;
  const failedAdd = [], failedRemove = [];

  for (const e of toCreate) {
    const sid = uuidShort();
    const taggedNotes = e.notes ? `${e.notes}\n[SyncID:${sid}]` : `[SyncID:${sid}]`;
    const startStr = e.start.toISOString().slice(0, 10);
    const endDatePlus1 = new Date(e.end);
    endDatePlus1.setDate(endDatePlus1.getDate() + 1);
    const endStr = endDatePlus1.toISOString().slice(0, 10);
    try {
      await graphFetch(`/me/calendars/${calendarId}/events`, {
        method: "POST",
        body: JSON.stringify({
          subject: e.title,
          isAllDay: true,
          start: { dateTime: startStr + "T00:00:00", timeZone: "UTC" },
          end: { dateTime: endStr + "T00:00:00", timeZone: "UTC" },
          body: { contentType: "text", content: taggedNotes }
        })
      });
      workbookData.rows[e.rowIndex][workbookData.colIndex["Added to Calendar"]] = sid;
      added++;
    } catch (err) {
      failedAdd.push(e.title);
    }
  }

  for (const e of toDelete) {
    try {
      await graphFetch(`/me/events/${e.id}`, { method: "DELETE" });
      removed++;
    } catch (err) {
      failedRemove.push(e.title);
    }
  }

  // rebuild and download updated Excel file
  const newWs = XLSX.utils.aoa_to_sheet(workbookData.rows);
  const newWb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(newWb, newWs, workbookData.sheetName);
  XLSX.writeFile(newWb, currentFile.name.replace(".xlsx", "_updated.xlsx"));

  let msg = `Done - added ${added}, removed ${removed}.`;
  if (failedAdd.length) msg += ` Failed to add: ${failedAdd.join(", ")}.`;
  if (failedRemove.length) msg += ` Failed to remove: ${failedRemove.join(", ")}.`;
  msg += " An updated Excel file was downloaded - use that one next time so this run isn't repeated.";
  setStatus(msg);

  await refreshPreview();
};
</script>
</body>
</html>
