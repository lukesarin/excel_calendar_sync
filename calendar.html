<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A;
    --border:#2A2A2A;
    --text:#F5F0EA;
    --text-dim:#7A7A75;
    --live:#4CAF6D;
  }
  *{box-sizing:border-box; user-select:none;}
  body{
    margin:0;
    background-color:#0D0D0C;
    background-image:
      linear-gradient(rgba(245,240,234,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245,240,234,0.035) 1px, transparent 1px),
      radial-gradient(rgba(245,240,234,0.05) 1.5px, transparent 1.5px);
    background-size: 64px 64px, 64px 64px, 64px 64px;
    background-position: 0 0, 0 0, 32px 32px;
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    min-height:100vh;
    padding:32px 20px 140px;
  }
  a{ color:var(--text-dim); text-decoration:none; font-family:'IBM Plex Mono',monospace; font-size:12px; }
  a:hover{ color:var(--text); }

  .top-nav{
    display:flex;
    justify-content:center;
    gap:24px;
    margin-bottom:24px;
  }
  .top-nav a{
    padding:6px 14px;
    border:1px solid var(--border);
    border-radius:999px;
  }
  .top-nav a.active{ color:var(--text); border-color:var(--text-dim); }

  .topbar{
    max-width:900px;
    margin:0 auto 28px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .month-nav{
    display:flex;
    align-items:center;
    gap:18px;
  }
  .month-nav button{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
    width:30px; height:30px;
    border-radius:50%;
    cursor:pointer;
    font-size:14px;
    display:flex; align-items:center; justify-content:center;
  }
  .month-nav button:hover{ border-color:var(--text-dim); }
  .month-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    letter-spacing:0.02em;
    min-width:150px;
    text-align:center;
  }

  .grid-panel{
    max-width:900px;
    margin:0 auto;
    background:#000;
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
  }
  .weekday-row{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    margin-bottom:8px;
  }
  .weekday-row div{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    text-align:center;
    padding:4px 0;
  }
  .day-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
  }
  .day-cell{
    min-height:92px;
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px;
    cursor:pointer;
    position:relative;
    display:flex;
    flex-direction:column;
    gap:4px;
    transition:background 0.1s, border-color 0.1s;
    overflow:hidden;
  }
  .day-cell.other-month{ opacity:0.25; cursor:default; }
  .day-cell:not(.other-month):hover{ border-color:var(--text-dim); }
  .day-cell.selected{
    background:rgba(76,175,109,0.12);
    border-color:var(--live);
  }
  .day-num{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
  }
  .day-cell.selected .day-num{ color:var(--text); }
  .event-titles{
    display:flex;
    flex-direction:column;
    gap:2px;
    overflow:hidden;
  }
  .event-title-chip{
    font-size:10.5px;
    line-height:1.3;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    padding:1px 5px;
    border-radius:4px;
    background:rgba(245,240,234,0.08);
  }
  .event-title-more{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--text-dim);
    padding-left:5px;
  }
  .day-plus{
    position:absolute;
    top:5px; right:5px;
    width:18px; height:18px;
    border-radius:50%;
    border:1px solid var(--border);
    background:rgba(0,0,0,0.4);
    color:var(--text-dim);
    font-size:12px;
    line-height:1;
    padding:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0.55;
  }
  .day-plus:hover{
    opacity:1;
    color:var(--text);
    border-color:var(--text-dim);
  }

  .modal-backdrop{
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,0.6);
    z-index:50;
    align-items:center;
    justify-content:center;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background:#111;
    border:1px solid var(--border);
    border-radius:16px;
    padding:24px;
    width:420px;
    max-width:92vw;
    max-height:80vh;
    display:flex;
    flex-direction:column;
  }
  .modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
  }
  .modal-date{
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
  }
  .modal-close{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
    width:26px; height:26px;
    border-radius:50%;
    cursor:pointer;
    font-size:14px;
    line-height:1;
  }
  .modal-events{
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:16px;
    max-height:260px;
  }
  .modal-events .empty-hint{
    color:var(--text-dim);
    font-size:13px;
  }
  .event-card{
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    position:relative;
  }
  .event-card .ev-title{
    font-weight:600;
    font-size:14px;
    margin-bottom:4px;
    padding-right:22px;
  }
  .event-card .ev-details{
    font-size:12px;
    color:var(--text-dim);
    white-space:pre-wrap;
  }
  .event-card .ev-delete{
    position:absolute;
    top:8px; right:8px;
    background:transparent;
    border:none;
    color:var(--text-dim);
    cursor:pointer;
    font-size:14px;
  }
  .event-card .ev-delete:hover{ color:#e08080; }
  .modal-add{
    border-top:1px solid var(--border);
    padding-top:14px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .modal-add input, .modal-add textarea{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13px;
    background:#000;
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 10px;
    border-radius:8px;
    resize:vertical;
  }
  .modal-add textarea{ min-height:56px; }
  .modal-add button{
    align-self:flex-end;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13px;
    padding:8px 14px;
    border-radius:20px;
    border:1px solid var(--border);
    background:var(--text);
    color:#000;
    cursor:pointer;
  }


  #signinPrompt{
    max-width:900px;
    margin:0 auto 20px;
    text-align:center;
  }
  #signinPrompt button{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:14px;
    padding:10px 18px;
    border-radius:20px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text);
    cursor:pointer;
  }
  #notPaired{
    max-width:900px;
    margin:60px auto;
    text-align:center;
    color:var(--text-dim);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    line-height:1.8;
  }

  .action-bar{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translate(-50%, 140%);
    transition:transform 0.2s ease;
    background:#111;
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px 20px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:12px;
    max-width:92vw;
    box-shadow:0 12px 40px rgba(0,0,0,0.5);
  }
  .action-bar.open{ transform:translate(-50%, 0); }
  .action-bar .count{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--live);
    margin-right:6px;
  }
  .action-bar button, .action-bar input{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13px;
    padding:8px 12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text);
    cursor:pointer;
  }
  .action-bar input{ cursor:text; width:64px; }
  .action-bar input[type=text]{ width:160px; }
  .action-bar button:hover{ border-color:var(--text-dim); }
  .action-bar button.danger:hover{ border-color:#c85a5a; color:#e08080; }
  .action-bar .sep{ width:1px; height:20px; background:var(--border); }
  #actionStatus{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    width:100%;
    text-align:center;
  }
</style>
</head>
<body>

<div class="top-nav">
  <a href="index.html">home</a>
  <a href="calendar.html" class="active">planner</a>
</div>

<div class="topbar">
  <a href="index.html">&larr; home</a>
  <div class="month-nav">
    <button id="prevMonth">&lsaquo;</button>
    <div class="month-label" id="monthLabel">-</div>
    <button id="nextMonth">&rsaquo;</button>
  </div>
  <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim);">demo mode &mdash; sample data</div>
</div>

<div class="grid-panel" id="gridPanel">
  <div class="weekday-row">
    <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
  </div>
  <div class="day-grid" id="dayGrid"></div>
</div>

<div class="action-bar" id="actionBar">
  <span class="count" id="selCount">0 selected</span>
  <input type="number" id="moveDays" value="1" min="1">
  <button id="moveBack">&larr; move back</button>
  <button id="moveFwd">move forward &rarr;</button>
  <div class="sep"></div>
  <input type="text" id="noteText" placeholder="add note to all...">
  <button id="applyNote">apply</button>
  <div class="sep"></div>
  <button class="danger" id="deleteAll">delete all</button>
  <div class="sep"></div>
  <button id="clearSel">clear</button>
  <div id="actionStatus"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-date" id="modalDate"></div>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-events" id="modalEvents"></div>
    <div class="modal-add">
      <input type="text" id="newEventTitle" placeholder="Event title">
      <textarea id="newEventDetails" placeholder="Details (optional)"></textarea>
      <button id="addEventBtn">Add event</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

let current = new Date();
current.setDate(1);
let eventsByDay = {};
let selectedDays = new Set();
let dragging = false;
let dragAnchor = null;
let dragMoved = false;
let dragBaseSelection = new Set();
let nextFakeId = 1;
let modalDayKey = null;

const SAMPLE_TITLES = ["Team Meeting", "Client Call", "Site Visit", "Review", "Deadline", "Check-in", "Planning Session", "Walkthrough"];
const SAMPLE_DETAILS = [
  "Discuss weekly progress and blockers.",
  "Call with client to review deliverables.",
  "On-site inspection, bring checklist.",
  "Review latest draft before sign-off.",
  "Final deadline - no extensions.",
  "Quick status check-in, 15 min.",
  "Plan next phase of the project.",
  "Walk the site with the team lead."
];

function seedSampleEvents(monthDate) {
  // deterministic-ish sample events scattered across the visible month
  const daysInMonth = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0).getDate();
  const dayNumbers = [2, 5, 5, 9, 14, 14, 18, 21, 24, 27].filter(d => d <= daysInMonth);
  dayNumbers.forEach((dayNum, i) => {
    const d = new Date(monthDate.getFullYear(), monthDate.getMonth(), dayNum);
    const key = dateKey(d);
    if (!eventsByDay[key]) eventsByDay[key] = [];
    eventsByDay[key].push({
      id: "demo-" + (nextFakeId++),
      title: SAMPLE_TITLES[i % SAMPLE_TITLES.length],
      dateKey: key,
      details: SAMPLE_DETAILS[i % SAMPLE_DETAILS.length]
    });
  });
}

function monthLabel(d) {
  return d.toLocaleDateString(undefined, { month: "long", year: "numeric" });
}

function loadMonth() {
  $("monthLabel").textContent = monthLabel(current);
  const gridStart = new Date(current.getFullYear(), current.getMonth(), 1);
  gridStart.setDate(gridStart.getDate() - gridStart.getDay());

  eventsByDay = {};
  seedSampleEvents(current);

  renderGrid(gridStart);
}

function currentGridStart() {
  const gridStart = new Date(current.getFullYear(), current.getMonth(), 1);
  gridStart.setDate(gridStart.getDate() - gridStart.getDay());
  return gridStart;
}

function renderGrid(gridStart) {
  const grid = $("dayGrid");
  grid.innerHTML = "";
  const MAX_VISIBLE_TITLES = 3;
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart);
    d.setDate(d.getDate() + i);
    const key = dateKey(d);
    const isOtherMonth = d.getMonth() !== current.getMonth();

    const cell = document.createElement("div");
    cell.className = "day-cell" + (isOtherMonth ? " other-month" : "");
    cell.dataset.key = key;
    if (selectedDays.has(key)) cell.classList.add("selected");

    const num = document.createElement("div");
    num.className = "day-num";
    num.textContent = d.getDate();
    cell.appendChild(num);

    const titlesWrap = document.createElement("div");
    titlesWrap.className = "event-titles";
    const evs = eventsByDay[key] || [];
    evs.slice(0, MAX_VISIBLE_TITLES).forEach(ev => {
      const chip = document.createElement("div");
      chip.className = "event-title-chip";
      chip.textContent = ev.title;
      titlesWrap.appendChild(chip);
    });
    if (evs.length > MAX_VISIBLE_TITLES) {
      const more = document.createElement("div");
      more.className = "event-title-more";
      more.textContent = `+${evs.length - MAX_VISIBLE_TITLES} more`;
      titlesWrap.appendChild(more);
    }
    cell.appendChild(titlesWrap);

    if (!isOtherMonth) {
      const plusBtn = document.createElement("button");
      plusBtn.className = "day-plus";
      plusBtn.textContent = "+";
      plusBtn.title = "Add / view events";
      plusBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
      plusBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        openDayModal(key);
      });
      cell.appendChild(plusBtn);

      cell.addEventListener("pointerdown", (e) => onCellDown(e, key));
      cell.addEventListener("pointerenter", () => onCellEnter(key));
    }
    grid.appendChild(cell);
  }
}

function onCellDown(e, key) {
  dragging = true;
  dragAnchor = key;
  dragMoved = false;
  // snapshot the selection as it stood before this click/drag started,
  // so a click or drag ADDS to whatever's already selected
  dragBaseSelection = new Set(selectedDays);
}

function onCellEnter(key) {
  if (!dragging) return;
  if (key !== dragAnchor) dragMoved = true;
  const allKeys = Array.from(document.querySelectorAll(".day-cell:not(.other-month)")).map(c => c.dataset.key);
  const startIdx = allKeys.indexOf(dragAnchor);
  const curIdx = allKeys.indexOf(key);
  if (startIdx === -1 || curIdx === -1) return;
  const [lo, hi] = startIdx < curIdx ? [startIdx, curIdx] : [curIdx, startIdx];
  const range = allKeys.slice(lo, hi + 1);
  selectedDays = new Set([...dragBaseSelection, ...range]);
  refreshSelectionVisual();
}

document.addEventListener("pointerup", () => {
  if (dragging && dragAnchor) {
    if (dragMoved) {
      // drag finished - selection already merged in onCellEnter, nothing more to do
    } else {
      // plain click, no drag -> toggle this single day in/out of the selection
      const next = new Set(dragBaseSelection);
      if (next.has(dragAnchor)) next.delete(dragAnchor);
      else next.add(dragAnchor);
      selectedDays = next;
      refreshSelectionVisual();
    }
  }
  dragging = false;
});

function refreshSelectionVisual() {
  document.querySelectorAll(".day-cell").forEach(c => {
    c.classList.toggle("selected", selectedDays.has(c.dataset.key));
  });
  $("selCount").textContent = `${selectedDays.size} day${selectedDays.size===1?"":"s"} selected`;
  $("actionBar").classList.toggle("open", selectedDays.size > 0);
}

$("clearSel").onclick = () => { selectedDays = new Set(); refreshSelectionVisual(); };

// ---------- Day detail modal ----------

function formatModalDate(key) {
  const [y, m, d] = key.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  return date.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
}

function openDayModal(key) {
  modalDayKey = key;
  $("modalDate").textContent = formatModalDate(key);
  $("newEventTitle").value = "";
  $("newEventDetails").value = "";
  renderModalEvents();
  $("modalBackdrop").classList.add("open");
}

function closeDayModal() {
  $("modalBackdrop").classList.remove("open");
  modalDayKey = null;
}

function renderModalEvents() {
  const list = $("modalEvents");
  list.innerHTML = "";
  const evs = eventsByDay[modalDayKey] || [];
  if (!evs.length) {
    list.innerHTML = '<div class="empty-hint">No events yet - add one below.</div>';
    return;
  }
  evs.forEach(ev => {
    const card = document.createElement("div");
    card.className = "event-card";

    const del = document.createElement("button");
    del.className = "ev-delete";
    del.textContent = "\u2715";
    del.onclick = () => {
      eventsByDay[modalDayKey] = (eventsByDay[modalDayKey] || []).filter(e => e.id !== ev.id);
      renderModalEvents();
      renderGrid(currentGridStart());
    };
    card.appendChild(del);

    const title = document.createElement("div");
    title.className = "ev-title";
    title.textContent = ev.title;
    card.appendChild(title);

    if (ev.details) {
      const details = document.createElement("div");
      details.className = "ev-details";
      details.textContent = ev.details;
      card.appendChild(details);
    }

    list.appendChild(card);
  });
}

$("modalClose").onclick = closeDayModal;
$("modalBackdrop").onclick = (e) => { if (e.target.id === "modalBackdrop") closeDayModal(); };

$("addEventBtn").onclick = () => {
  const title = $("newEventTitle").value.trim();
  const details = $("newEventDetails").value.trim();
  if (!title) { $("newEventTitle").focus(); return; }
  if (!eventsByDay[modalDayKey]) eventsByDay[modalDayKey] = [];
  eventsByDay[modalDayKey].push({
    id: "demo-" + (nextFakeId++),
    title,
    dateKey: modalDayKey,
    details
  });
  $("newEventTitle").value = "";
  $("newEventDetails").value = "";
  renderModalEvents();
  renderGrid(currentGridStart());
};

function selectedEvents() {
  let evs = [];
  selectedDays.forEach(key => { evs = evs.concat(eventsByDay[key] || []); });
  return evs;
}

function setActionStatus(msg) { $("actionStatus").textContent = msg; }

function moveSelected(deltaDays) {
  const evs = selectedEvents();
  if (!evs.length) { setActionStatus("No events in the selected days."); return; }

  evs.forEach(ev => {
    const oldKey = ev.dateKey;
    const [y, m, d] = oldKey.split("-").map(Number);
    const newDate = new Date(y, m - 1, d);
    newDate.setDate(newDate.getDate() + deltaDays);
    const newKey = dateKey(newDate);

    eventsByDay[oldKey] = (eventsByDay[oldKey] || []).filter(e => e.id !== ev.id);
    if (!eventsByDay[newKey]) eventsByDay[newKey] = [];
    ev.dateKey = newKey;
    eventsByDay[newKey].push(ev);
  });

  setActionStatus(`Moved ${evs.length} event(s) (demo only - not saved anywhere).`);
  selectedDays = new Set();
  const gridStart = new Date(current.getFullYear(), current.getMonth(), 1);
  gridStart.setDate(gridStart.getDate() - gridStart.getDay());
  renderGrid(gridStart);
  refreshSelectionVisual();
}

$("moveFwd").onclick = () => moveSelected(parseInt($("moveDays").value || "1", 10));
$("moveBack").onclick = () => moveSelected(-parseInt($("moveDays").value || "1", 10));

$("applyNote").onclick = () => {
  const note = $("noteText").value.trim();
  if (!note) { setActionStatus("Type a note first."); return; }
  const evs = selectedEvents();
  if (!evs.length) { setActionStatus("No events in the selected days."); return; }
  evs.forEach(ev => { ev.details = (ev.details ? ev.details + "\n" : "") + note; });
  setActionStatus(`Added note to ${evs.length} event(s) (demo only).`);
};

$("deleteAll").onclick = () => {
  const evs = selectedEvents();
  if (!evs.length) { setActionStatus("No events in the selected days."); return; }
  if (!confirm(`Delete ${evs.length} event(s) from ${selectedDays.size} day(s)? (demo only, nothing real is deleted)`)) return;

  evs.forEach(ev => {
    eventsByDay[ev.dateKey] = (eventsByDay[ev.dateKey] || []).filter(e => e.id !== ev.id);
  });

  setActionStatus(`Deleted ${evs.length} event(s) (demo only).`);
  selectedDays = new Set();
  const gridStart = new Date(current.getFullYear(), current.getMonth(), 1);
  gridStart.setDate(gridStart.getDate() - gridStart.getDay());
  renderGrid(gridStart);
  refreshSelectionVisual();
};

$("prevMonth").onclick = () => {
  current.setMonth(current.getMonth() - 1);
  selectedDays = new Set();
  loadMonth();
  refreshSelectionVisual();
};
$("nextMonth").onclick = () => {
  current.setMonth(current.getMonth() + 1);
  selectedDays = new Set();
  loadMonth();
  refreshSelectionVisual();
};

loadMonth();
</script>
</body>
</html>
